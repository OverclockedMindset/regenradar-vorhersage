name: ICON-D2 Regenvorhersage

on:
  schedule:
    # ICON-D2 und ICON-EU erscheinen zu unterschiedlichen Zeiten. Der Job prüft stündlich und lädt nur,
    # wenn ein neuer Lauf da ist.
    - cron: "40 * * * *"
    # Hält den Zeitplan am Leben (GitHub schaltet Zeitpläne nach 60 Tagen ohne Aktivität ab)
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: icon-d2
  cancel-in-progress: false

env:
  # Hier liegen die fertigen Dateien. Ist der neueste Lauf dort schon da, wird nichts neu geladen.
  PUBLISHED_URL: https://regenradar-daten.fabianwalter.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install numpy

      - name: Programme installieren (lftp, libaec)
        if: github.event.schedule != '0 5 * * 1'
        run: sudo apt-get install -y --no-install-recommends lftp libaec0 >/dev/null

      - name: ICON-D2 holen und umrechnen (48 Stunden)
        if: github.event.schedule != '0 5 * * 1'
        run: python icon_d2_job.py --model d2 --out out

      - name: ICON-EU holen und umrechnen (bis +5 Tage)
        if: github.event.schedule != '0 5 * * 1'
        # Ein Fehler hier soll die 48-Stunden-Vorhersage nicht verhindern
        continue-on-error: true
        run: python icon_d2_job.py --model eu --out out

      - name: ICON-D2 Wetterfelder holen (Temperatur, Wind, Wolken)
        if: github.event.schedule != '0 5 * * 1'
        # Ein Fehler hier soll die Regenvorhersage nicht verhindern
        continue-on-error: true
        run: python icon_d2_job.py --model wx --out out

      - name: ICON-EU Wetterfelder holen (Tage 3-5)
        if: github.event.schedule != '0 5 * * 1'
        continue-on-error: true
        run: python icon_d2_job.py --model wxeu --out out

      - name: Auf das Webhosting hochladen
        if: github.event.schedule != '0 5 * * 1'
        env:
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}   # sftp oder ftp (ftp wird mit TLS verlangt)
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          shopt -s nullglob
          files=(out/*.gz out/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "Nichts Neues hochzuladen"; exit 0; fi
          proto="${FTP_PROTOCOL:-sftp}"
          {
            echo "set net:max-retries 3"
            echo "set net:timeout 30"
            echo "set sftp:auto-confirm yes"
            if [ "$proto" = "ftp" ]; then
              echo "set ftp:ssl-force true"
              echo "set ftp:ssl-protect-data true"
              echo "set ssl:verify-certificate yes"
            fi
            echo "cd \"${FTP_DIR:-.}\""
            # Erst unter vorläufigem Namen hochladen, dann umbenennen: die App sieht nie halbe Dateien.
            for f in "${files[@]}"; do
              b=$(basename "$f")
              echo "put \"$f\" -o \"$b.tmp\""
              echo "rm -f \"$b\""
              echo "mv \"$b.tmp\" \"$b\""
            done
            echo "bye"
          } > upload.lftp
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$proto://$FTP_HOST" < upload.lftp
          rm -f upload.lftp

      - name: Lebenszeichen (leerer Commit, damit der Zeitplan aktiv bleibt)
        if: github.event.schedule == '0 5 * * 1'
        run: |
          git config user.name "icon-d2-job"
          git config user.email "icon-d2-job@users.noreply.github.com"
          git commit --allow-empty -m "Lebenszeichen"
          git push
